<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Personal Edit</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f7f5f0,#11110f);--paper:light-dark(#fffdf8,#191916);--ink:light-dark(#171714,#f3f0e8);--muted:light-dark(#6e6b63,#aaa69a);--line:light-dark(#dedbd2,#393832);--accent:light-dark(#a64b2a,#d88a67);--soft:light-dark(#eee9df,#292821)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{min-height:100vh;background:var(--bg)}
a{color:inherit;text-decoration:none}button{font:inherit}
.nav{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,5vw,72px);position:sticky;top:0;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(14px);z-index:10}.brand{font-family:Georgia,serif;font-size:25px;letter-spacing:-.5px}.navlinks{display:flex;gap:28px;font-size:13px;color:var(--muted)}.navlinks a:hover{color:var(--ink)}.menu{display:none;border:0;background:none;color:var(--ink);font-size:23px}
.hero{max-width:1180px;margin:auto;padding:86px clamp(20px,5vw,72px) 58px}.eyebrow{text-transform:uppercase;letter-spacing:2.2px;font-size:11px;color:var(--accent);font-weight:700}.hero h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(50px,7vw,92px);line-height:.93;letter-spacing:-4px;max-width:920px;margin:20px 0 25px}.hero p{max-width:620px;color:var(--muted);font-size:17px;line-height:1.7}.rule{height:1px;background:var(--line);margin-top:55px}
.featured{max-width:1180px;margin:auto;padding:0 clamp(20px,5vw,72px) 80px}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:22px}.card{background:var(--paper);border:1px solid var(--line);overflow:hidden;transition:transform .25s,box-shadow .25s;cursor:pointer}.card:hover{transform:translateY(-4px);box-shadow:0 16px 40px #00000012}.card:first-child{grid-row:span 2}.visual{height:255px;position:relative;overflow:hidden}.card:first-child .visual{height:430px}.visual.frag{background:radial-gradient(circle at 70% 35%,#e4a36e 0,#a94d2f 28%,#4b2119 66%,#17100d 100%)}.visual.travel{background:linear-gradient(150deg,#92c7df,#dcebc7 48%,#7a9a70)}.visual.ai{background:linear-gradient(145deg,#0d1523,#1b3c56 55%,#bd6d46)}.bottle{position:absolute;width:118px;height:170px;border-radius:14px 14px 22px 22px;background:linear-gradient(90deg,#17100d,#6c351f,#24120d);left:50%;top:52%;transform:translate(-50%,-50%) rotate(-5deg);box-shadow:25px 25px 35px #0008}.bottle:before{content:"";position:absolute;width:44px;height:35px;left:37px;top:-31px;background:#17100d;border-radius:5px 5px 0 0}.bottle:after{content:"RASASI";position:absolute;left:18px;right:18px;top:70px;text-align:center;color:#ead8b4;font:700 12px Georgia;letter-spacing:2px}.tower{position:absolute;left:55%;bottom:-30px;width:42px;height:220px;background:linear-gradient(90deg,#718e98,#e7f0ed,#55717b);clip-path:polygon(42% 0,58% 0,67% 52%,100% 100%,0 100%,33% 52%)}.sun{position:absolute;width:145px;height:145px;border-radius:50%;background:#f5d28c;right:12%;top:15%}.fields{position:absolute;bottom:0;width:100%;height:45%;background:repeating-linear-gradient(165deg,#789566 0 12px,#8da77a 12px 22px)}.node{position:absolute;width:8px;height:8px;background:#e7b08e;border-radius:50%;box-shadow:90px 35px 0 #e7b08e,170px -18px 0 #e7b08e,250px 60px 0 #e7b08e,330px 10px 0 #e7b08e}.lines{position:absolute;inset:0;background:linear-gradient(20deg,transparent 49%,#6fc1d533 50%,transparent 51%),linear-gradient(155deg,transparent 49%,#d98c6d33 50%,transparent 51%)}.cardbody{padding:25px 25px 29px}.tag{font-size:10px;text-transform:uppercase;letter-spacing:1.7px;color:var(--accent);font-weight:700}.card h2{font:400 clamp(25px,3vw,38px)/1.03 Georgia,serif;letter-spacing:-1px;margin:11px 0}.card p{color:var(--muted);line-height:1.65;margin:0}.meta{display:flex;gap:12px;color:var(--muted);font-size:11px;margin-top:20px}
.section{max-width:1180px;margin:auto;padding:65px clamp(20px,5vw,72px)}.sectionhead{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:28px}.section h3{font:400 36px Georgia,serif;margin:0}.sectionhead span{color:var(--muted);font-size:12px}.about{display:grid;grid-template-columns:1fr 1fr;gap:80px}.about p{font:400 24px/1.45 Georgia,serif;margin:0}.about .small{font:15px/1.8 Inter,system-ui;color:var(--muted)}
.article{max-width:900px;margin:auto;padding:75px 20px 100px}.article .heroart{height:360px;margin:45px 0;background:var(--soft);overflow:hidden;position:relative}.article h1{font:400 clamp(48px,7vw,76px)/.98 Georgia,serif;letter-spacing:-3px;margin:18px 0}.dek{font-size:20px;line-height:1.65;color:var(--muted);max-width:760px}.articlebody{max-width:720px;margin:50px auto 0}.articlebody h2{font:400 31px Georgia,serif;margin:48px 0 14px}.articlebody p{font:17px/1.85 Georgia,serif;color:color-mix(in srgb,var(--ink) 88%,var(--muted));margin:0 0 20px}.quote{border-left:3px solid var(--accent);padding:10px 0 10px 22px;font:italic 24px/1.5 Georgia,serif;margin:38px 0}.flow{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:30px 0;padding:25px;background:var(--soft);font-size:12px}.flow b{padding:10px 12px;background:var(--paper);border:1px solid var(--line);font-weight:600}.flow i{color:var(--accent);font-style:normal}.disclaimer{font:12px/1.6 Inter,system-ui!important;color:var(--muted)!important;border-top:1px solid var(--line);padding-top:20px;margin-top:40px}
footer{border-top:1px solid var(--line);padding:35px clamp(20px,5vw,72px);display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.hidden{display:none}.back{display:inline-flex;gap:8px;color:var(--muted);font-size:12px;margin-bottom:25px}.back:hover{color:var(--ink)}
@media(max-width:760px){.navlinks{display:none}.menu{display:block}.grid{grid-template-columns:1fr}.card:first-child{grid-row:auto}.card:first-child .visual{height:300px}.visual{height:220px}.hero{padding-top:60px}.hero h1{letter-spacing:-2.5px}.about{grid-template-columns:1fr;gap:25px}.about p{font-size:21px}.article{padding-top:50px}.article .heroart{height:260px}footer{flex-direction:column;gap:10px}}
</style>
</head>
<body>
<div class="app" id="app">
<header class="nav"><a class="brand" href="#">The Personal Edit</a><nav class="navlinks"><a href="#">Home</a><a href="#article/rasasi">Fragrance</a><a href="#article/canada">Travel</a><a href="#article/ai">AI & Business</a><a href="#about">About</a></nav><button class="menu" aria-label="Menu">☰</button></header>
<main id="main"></main>
<footer><span>© 2026 The Personal Edit</span><span>Personal stories · Places · Ideas worth questioning</span></footer>
</div>
<script>
const articles={
rasasi:{tag:'Fragrance',title:'Why I End Up Choosing Rasasi Every Single Time',dek:"Every time I promise myself I'll try something new, I somehow walk out with a Rasasi bottle in hand. At this point, I've stopped fighting it.",visual:'frag',sections:[['The Oud Factor',`Rasasi does oud better than almost anyone. Their compositions feel rich and layered without being suffocating. You get that deep, woody warmth with hints of amber, saffron, or rose, and it feels authentic rather than a watered-down “Western idea” of Arabian perfume. It smells like heritage, but wearable in everyday life.`],['Performance That Actually Delivers',`Let's be honest: nobody wants a fragrance that disappears by lunch. Rasasi's projection and longevity are ridiculous for the price. I spray once in the morning, and I'm still catching whiffs of it on my shirt at night. Compliments come without me having to bathe in the stuff.`],['Value Without Compromise',`Luxury designer houses charge a fortune mostly for the name on the bottle. Rasasi charges for the juice. You get concentrated, high-quality perfume oils and attar-style depth at a fraction of what you'd pay for a comparable European niche brand. My wallet and my nose are both happy.`],['Variety for Every Mood',`People assume Middle Eastern perfumery means heavy and dramatic, but Rasasi's range surprises me. There are fresh, citrusy options for summer days, sweet gourmand blends for evenings, and bold, smoky ones for special occasions. Whatever mood I'm in, there's usually a bottle that fits.`],['It Feels Personal',`Wearing Rasasi doesn't feel like wearing what everyone else has. When someone asks “what are you wearing?”, the answer starts a conversation, and I love being the person who introduces a friend to something they haven't smelled before.`],['The Comfort of Consistency',`Ultimately, it comes down to trust. I know what I'm getting: quality ingredients, thoughtful blending, and a scent that lasts. In a world of hype-driven launches and overpriced bottles, that reliability is rare.`]],close:`So yes, I'll keep browsing other brands for fun. But when it's time to actually choose? I already know where I'm heading. Rasasi wins, every time.`},
canada:{tag:'Travel',title:'My Canadian Experience',dek:'Visiting Canada was one of those trips that felt like a mix of city buzz and quiet countryside, and I loved every bit of it.',visual:'travel',sections:[['Brampton',`Brampton felt surprisingly familiar. The streets were lively, the food was fantastic, and I could find everything from great desi restaurants to cozy cafés. It was warm, welcoming, and easy to settle into, like a home away from home.`],['Mississauga',`Mississauga was calm and clean, with a modern feel. I enjoyed walking near the waterfront and exploring the shopping areas. Everything felt organized and peaceful, a nice break from the rush of a big city.`],['Toronto',`Toronto was the highlight of the city experience. The CN Tower dominates the skyline, and going up gave me a view I won't forget. Downtown was full of energy, with people from every corner of the world, street food, and endless things to see. Every neighborhood had its own personality, and I could have spent days just wandering around.`],['The Farmlands',`Leaving the city behind for the farmlands was a refreshing change. Wide open fields, fresh air, and quiet roads stretched as far as I could see. Nothing beats the feeling of standing in a place with no noise except the wind. It was the most peaceful part of my trip.`],['Blue Mountain Village',`Blue Mountain Village felt like something out of a postcard. Colorful buildings, small shops, and a relaxed mountain atmosphere made it a perfect getaway. I strolled through the village, grabbed a treat, and simply enjoyed the scenery. The surrounding hills and fresh air made it feel like a proper vacation.`],['Final Thoughts',`What I loved most about Canada was the variety. In just one trip, I experienced busy city life, peaceful countryside, and a charming mountain village. People were kind and polite, the surroundings were clean, and there was always something new to explore. I came back with great memories, lots of photos, and a strong wish to return. Canada truly has something for everyone, and I'm already dreaming about my next visit.`]],close:''},
ai:{tag:'AI & Business',title:"The Truth About AI Companies' Financials",dek:'Behind the extraordinary valuations, enormous infrastructure bills, massive capital requirements, and spectacular growth stories is a much more complicated financial picture.',visual:'ai',sections:[['The Valuation Problem',`Some AI companies and AI-related businesses have reached extraordinary private-market or public-market valuations based heavily on expectations of future growth. But revenue, profit, valuation and cash flow are four different things. A high valuation does not necessarily mean a company is currently profitable; it reflects what investors are willing to pay based on assumptions about the future.`],['Revenue Is Growing — But So Are the Costs',`AI companies can generate rapidly increasing revenue while simultaneously facing enormous expenses. GPUs and specialized hardware, data centers, electricity, cloud computing, data acquisition, research, engineering talent, training and inference all contribute to the cost structure. Growing revenue and sustainable free cash flow are not the same milestone.`],['The AI Infrastructure Bill',`Generative AI is unusually capital-intensive. Large models require significant computing resources to train and operate, and every user query can create an inference cost. The basic economic relationship is simple: more users can mean more inference, which means more computing, which means higher infrastructure costs.`],['The Race for Scale',`AI companies may have incentives to spend aggressively because computing capacity, talent, distribution and model capability can create competitive advantages. That creates a tension between “spend now to dominate the market” and “prove that the economics eventually work.” Neither position can be treated as automatically correct.`],['The Funding Machine',`The AI ecosystem is connected to large amounts of capital from venture capital, private equity, public markets, strategic corporate investments, debt and infrastructure financing. Capital can allow companies to sustain high spending while they attempt to scale revenue.`],['What Does “Loss-Making” Actually Mean?',`Accounting losses and cash losses are not always identical. Operating expenses, capital expenditure, depreciation, cash flow, free cash flow and gross margin tell different parts of the story. Understanding those distinctions is essential before drawing conclusions from a single headline number.`],['Are We Looking at an AI Bubble?',`When people describe a financial bubble, they usually mean a combination of extremely high expectations, rapid asset-price appreciation, valuations based heavily on future growth, large amounts of capital flowing into one theme, and a possible disconnect between current fundamentals and expectations. Some of those characteristics can be observed around parts of AI, but calling the entire industry a bubble is an interpretation, not an established fact.`],['The Question Nobody Can Answer Yet',`How much future AI growth is already priced into today's valuations? The answer depends on assumptions about future revenue, margins, computing costs, competition, model commoditization, enterprise adoption, consumer demand, pricing and capital requirements. The interesting question isn't whether AI is real. It clearly is. The harder question is whether the financial expectations surrounding it are growing faster than the economics can justify.`]],close:''}
};
function visual(type){return type==='frag'?'<div class="bottle"></div>':type==='travel'?'<div class="sun"></div><div class="tower"></div><div class="fields"></div>':'<div class="lines"></div><div class="node"></div>'}
function home(){return `<section class="hero"><div class="eyebrow">A personal digital magazine</div><h1>Things I experience, places I visit, and ideas worth questioning.</h1><p>Some posts are personal. Some are analytical. Some are simply things I wanted to write down. Welcome to The Personal Edit.</p><div class="rule"></div></section><section class="featured"><div class="grid">${card('rasasi')} ${card('canada')} ${card('ai')}</div></section><section class="section" id="about"><div class="sectionhead"><h3>About the edit</h3><span>01 / 01</span></div><div class="about"><p>Welcome to The Personal Edit — a space for fragrances, places, technology, business, and the questions that sit underneath them.</p><p class="small">The goal is simple: write honestly about things worth experiencing, and examine big ideas without pretending every answer is obvious.</p></div></section>`}
function card(id){let a=articles[id];return `<article class="card" onclick="location.hash='article/${id}'"><div class="visual ${a.visual}">${visual(a.visual)}</div><div class="cardbody"><div class="tag">${a.tag}</div><h2>${a.title}</h2><p>${a.dek}</p><div class="meta"><span>Read article</span><span>·</span><span>6 min</span></div></div></article>`}
function article(id){let a=articles[id];return `<article class="article"><a class="back" href="#">← Back to all stories</a><div class="eyebrow">${a.tag}</div><h1>${a.title}</h1><p class="dek">${a.dek}</p><div class="heroart visual ${a.visual}">${visual(a.visual)}</div><div class="articlebody">${a.sections.map((s,i)=>`<section><h2>${s[0]}</h2><p>${s[1]}</p>${id==='ai'&&i===2?'<div class="flow"><b>More users</b><i>→</i><b>More inference</b><i>→</i><b>More computing</b><i>→</i><b>Higher infrastructure costs</b></div>':''}${id==='ai'&&i===6?'<div class="quote">“The interesting question isn’t whether AI is real. It clearly is. The harder question is whether the financial expectations surrounding it are growing faster than the economics can justify.”</div>':''}</section>`).join('')}${a.close?`<div class="quote">${a.close}</div>`:''}${id==='ai'?'<p class="disclaimer">This article is editorial analysis, not financial advice. Company-specific financial figures should be verified against current filings, earnings reports, and reliable financial sources.</p>':''}</div></article>`}
function render(){let h=location.hash.slice(1);document.getElementById('main').innerHTML=h.startsWith('article/')?article(h.split('/')[1]||'rasasi'):home();window.scrollTo(0,0)}
window.addEventListener('hashchange',render);render();
</script>
</body></html>
